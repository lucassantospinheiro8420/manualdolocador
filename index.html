    <!-- Paginas FECHADAS de VSL (teste A/B de video pelo VTurb).
         Cada rota tem o SEU player. Preload + noindex sao aplicados so na rota
         da vez, entao a pagina de vendas nao baixa nada disso.
         Feito aqui e nao no head: () da rota porque o __root nao renderiza <HeadContent />.
         ROTA NOVA DE VSL: adicione uma linha no MAPA abaixo e crie src/routes/<slug>.tsx. -->
    <script>
    (function(){
      var BASE = "https://scripts.converteai.net/e39e1358-c294-4887-9186-6c5c21c2dc26/ab-test/";
      var MAPA = {
        "/vsl":   BASE + "6a89e9152d15b4a5d9500304/player.js",
        "/vsl-2": BASE + "6a8f7a6904f647dafd180efc/player.js"
      };
      var rota = location.pathname.toLowerCase().replace(/\/+$/, "") || "/";
      var player = MAPA[rota];
      if (!player) return;
      window.__VSL_PAGE = true;
      var head = document.head;
      [player, "https://scripts.converteai.net/lib/js/smartplayer-wc/v4/smartplayer.js"]
        .forEach(function(href){
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'script'; l.href = href;
          head.appendChild(l);
        });
      var m = document.createElement('meta');
      m.name = 'robots'; m.content = 'noindex, nofollow';
      head.appendChild(m);
      document.title = 'Manual do Locador de Carros';
    })();
    </script>

    <script>
    // Player da pagina de vendas. Injetado (equivalente ao <script async> antigo) para
    // poder PULAR a rota /vsl, que usa outro player (teste A/B). Sem isso o script antigo
    // baixa a toa la e ainda lanca erro por nao achar o elemento dele.
    (function(){
      if (window.__VSL_PAGE) return;
      var s = document.createElement('script');

    </script>
